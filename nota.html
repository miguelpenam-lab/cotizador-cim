*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f4f6f9;color:#1a1a1a;font-size:14px}
input,select,textarea{font-family:inherit;border:1px solid #d0d5dd;border-radius:6px;padding:7px 10px;font-size:13px;color:#1a1a1a;outline:none;background:#fff;width:100%;transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:#6ec25b;box-shadow:0 0 0 2px #6ec25b22}
button{font-family:inherit;cursor:pointer;border:none;transition:all .15s}
.btn-g{background:#6ec25b;color:#fff;border-radius:8px;padding:8px 18px;font-weight:700;font-size:13px}
.btn-n{background:#071740;color:#fff;border-radius:8px;padding:8px 18px;font-weight:700;font-size:13px}
.btn-ghost{background:#fff;color:#071740;border:1.5px solid #ccc;border-radius:8px;padding:8px 16px;font-weight:600;font-size:13px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:300;display:flex;align-items:flex-end;justify-content:center}
.modal-box{background:#fff;border-radius:16px 16px 0 0;width:100%;max-width:720px;max-height:90vh;overflow-y:auto;padding:18px}
.catalog-item{padding:8px 10px;border-bottom:1px solid #f0f0f0;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:12px;transition:background .1s;gap:8px}
.catalog-item:hover{background:#f0f7ee}
.toggle-pill{display:flex;gap:6px;flex-wrap:wrap}
.tpill{padding:6px 14px;border-radius:20px;font-size:12px;font-weight:600;border:1.5px solid #ccc;background:#fff;color:#888}
.tpill.on{background:#071740;color:#fff;border-color:#071740}
.seer-badge{background:#e8f0fe;color:#1a56b0;border-radius:4px;padding:1px 5px;font-size:10px;font-weight:600}
.wifi-badge{background:#e8f5e9;color:#2e7d32;border-radius:4px;padding:1px 5px;font-size:10px;font-weight:600}
.item-row{background:#f0f7ee;border:1px solid #6ec25b44;border-radius:8px;padding:9px 11px;margin-bottom:6px;display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
.sig-wrap{background:#fff;border:1.5px dashed #ccc;border-radius:10px;padding:10px;margin-bottom:14px}
.sig-canvas{width:100%;height:160px;border-radius:8px;background:#fcfcfc;border:1px solid #e0e0e0;touch-action:none;display:block}
@media print{
  .no-print{display:none!important}
  body{background:#fff}
  #print-area{padding:0!important;border:none!important;border-radius:0!important}
  #app>div{min-height:auto!important;padding-bottom:0!important}
  @page{margin:1.5cm;size:A4}
}
</style>

// ═══════════ FOLIO SECUENCIAL ═══════════
function nextFolio(prefix){
  const year=new Date().getFullYear();
  const key='cim_folio_seq_'+prefix;
  let data={year:year,seq:0};
  try{const s=localStorage.getItem(key);if(s)data=JSON.parse(s);}catch(e){}
  if(data.year!==year){data.year=year;data.seq=0;}
  data.seq+=1;
  try{localStorage.setItem(key,JSON.stringify(data));}catch(e){}
  return prefix+'-'+year+'-'+String(data.seq).padStart(3,'0');
}

return {

  tipo:'entrega',

  cli:{nombre:'',tel:'',dir:'',correo:''},
  items:[],

  notas:'',
  firmaCliente:null,
  firmaEntrega:null,
  catalog:BASE_CAT,
  modal:null,pickerSearch:'',
};
}
let S=freshState();

function set(patch){Object.assign(S,patch);render();}
function resetState(){S=freshState();seedDefaultItem(S.tipo);render();}

function seedDefaultItem(tipo){
  if(S.items.length>0) return;
  if(tipo==='anticipo') S.items=[{id:uid(),desc:'Anticipo sobre cotización',cantidad:1,precio:0,tag:'manual'}];
  if(tipo==='final') S.items=[{id:uid(),desc:'Pago final / Liquidación',cantidad:1,precio:0,tag:'manual'}];
}

function syncForm(){
  const v=id=>{const e=document.getElementById(id);return e?e.value:'';};
  if(S.step===0) S.folio=v('f_folio')||S.folio;
  if(S.step===1) S.cli={nombre:v('f_nombre'),tel:v('f_tel'),dir:v('f_dir'),correo:v('f_correo')};
  if(S.step===2){
    S.totalCotizado=parseFloat(v('f_totalcot'))||0;
    S.notas=v('f_notas');
    S.items=S.items.map(it=>{
      const d=document.querySelector(`.it-desc[data-id="${it.id}"]`);
      const q=document.querySelector(`.it-qty[data-id="${it.id}"]`);
      const p=document.querySelector(`.it-precio[data-id="${it.id}"]`);
      return{...it,
        desc:d?d.value:it.desc,
        cantidad:q?Math.max(1,parseInt(q.value)||1):it.cantidad,
        precio:p?parseFloat(p.value)||0:it.precio};
    });
  }
}
function goStep(n){syncForm();set({step:n});}

function totalItems(){return S.items.reduce((a,x)=>a+(x.precio||0)*(x.cantidad||1),0);}

// ═══════════ SIGNATURE PADS ═══════════
function setupCanvas(canvas, existingDataUrl, onSave){
  if(!canvas) return;
  const ratio=window.devicePixelRatio||1;
  const rect=canvas.getBoundingClientRect();
  canvas.width=rect.width*ratio;canvas.height=rect.height*ratio;
  const ctx=canvas.getContext('2d');
  ctx.scale(ratio,ratio);
  ctx.strokeStyle=N;ctx.lineWidth=2.2;ctx.lineCap='round';ctx.lineJoin='round';
  if(existingDataUrl){const img=new Image();img.onload=()=>ctx.drawImage(img,0,0,rect.width,rect.height);img.src=existingDataUrl;}
  let drawing=false,lastX=0,lastY=0;
  const pos=e=>{const r=canvas.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top];};
  canvas.addEventListener('pointerdown',e=>{drawing=true;[lastX,lastY]=pos(e);canvas.setPointerCapture(e.pointerId);});
  canvas.addEventListener('pointermove',e=>{if(!drawing)return;const[x,y]=pos(e);ctx.beginPath();ctx.moveTo(lastX,lastY);ctx.lineTo(x,y);ctx.stroke();[lastX,lastY]=[x,y];});
  const end=()=>{if(!drawing)return;drawing=false;onSave(canvas.toDataURL('image/png'));};
  canvas.addEventListener('pointerup',end);
  canvas.addEventListener('pointerleave',end);
}
function initSignaturePads(){
  setupCanvas(document.getElementById('sig-cliente'),S.firmaCliente,url=>{S.firmaCliente=url;});
  setupCanvas(document.getElementById('sig-entrega'),S.firmaEntrega,url=>{S.firmaEntrega=url;});
}

// ═══════════ PDF GENERATION (jsPDF, siempre 1 hoja) ═══════════
const PDF_N=[7,23,64],PDF_G=[110,194,91];

function renderPdfDoc(fs){
  const {jsPDF}=window.jspdf;
  const q=QUOTERS[S.quoter];
  const saldo=S.totalCotizado>0?S.totalCotizado-totalItems():null;
  const k=fs/9;
  const doc=new jsPDF({unit:'mm',format:'a4'});
  const pw=210,marginX=14;let y=14+2*k;

  doc.setFont('times','italic');doc.setFontSize(fs+3);doc.setTextColor(...PDF_N);
  doc.text('Climas',marginX,y);
  doc.setDrawColor(...PDF_G);doc.setLineWidth(0.8);
  doc.line(marginX+16,y-3.2,marginX+58,y-3.2);
  doc.setFont('helvetica','bold');doc.setFontSize(fs+11);
  doc.setTextColor(...PDF_G);doc.text('In',marginX,y+9*k);
  const inW=doc.getTextWidth('In');
  doc.setTextColor(...PDF_N);doc.text('verter',marginX+inW,y+9*k);
  doc.setFont('times','normal');doc.setFontSize(fs+1);
  doc.text('Monterrey',marginX+3,y+13.5*k);

  doc.setFont('helvetica','bold');doc.setFontSize(fs+3);doc.setTextColor(...PDF_N);
  doc.text(docLabel().toUpperCase(),pw-marginX,y,{align:'right'});
  doc.setFont('helvetica','normal');doc.setFontSize(fs-1);doc.setTextColor(80,80,80);
  doc.text('Folio: '+S.folio,pw-marginX,y+5*k,{align:'right'});
  doc.text('Fecha: '+today,pw-marginX,y+9.5*k,{align:'right'});

  y+=18*k;
  doc.setDrawColor(...PDF_G);doc.setLineWidth(1);doc.line(marginX,y,pw-marginX,y);
  y+=8*k;

  const colW=(pw-marginX*2)/2;
  doc.setFont('helvetica','bold');doc.setFontSize(fs-2);doc.setTextColor(130,130,130);
  doc.text('CLIENTE',marginX,y);
  doc.text('ENTREGA / COBRA',marginX+colW,y);
  y+=5*k;
  doc.setFont('helvetica','bold');doc.setFontSize(fs+1);doc.setTextColor(...PDF_N);
  doc.text(S.cli.nombre||'—',marginX,y);
  doc.text(q.nombre,marginX+colW,y);
  y+=4.5*k;
  doc.setFont('helvetica','normal');doc.setFontSize(fs-1);doc.setTextColor(90,90,90);
  if(S.cli.tel) doc.text(S.cli.tel,marginX,y);
  doc.text(q.tel,marginX+colW,y);
  y+=7*k;

  doc.autoTable({
    startY:y,
    margin:{left:marginX,right:marginX},
    head:[['Concepto','Cant.','Precio unit.','Importe']],
    body:S.items.map(it=>[it.desc+(it.specs?'\n'+it.specs:''),String(it.cantidad),fmt(it.precio),fmt(it.precio*it.cantidad)]),
    theme:'grid',
    styles:{fontSize:fs-1,cellPadding:Math.max(0.8,fs/6),textColor:[30,30,30],lineColor:[230,230,230]},
    headStyles:{fillColor:PDF_N,textColor:255,fontStyle:'bold'},
    alternateRowStyles:{fillColor:[249,249,249]},
    columnStyles:{1:{halign:'center',cellWidth:16},2:{halign:'right',cellWidth:30},3:{halign:'right',cellWidth:30,fontStyle:'bold'}},
  });
  y=doc.lastAutoTable.finalY+8*k;

  const tx=pw-marginX;
  doc.setFont('helvetica','normal');doc.setFontSize(fs);doc.setTextColor(60,60,60);
  doc.text('Subtotal',tx-45,y);
  doc.setFont('helvetica','bold');doc.text(fmt(totalItems()),tx,y,{align:'right'});
  y+=5.5*k;
  if(saldo!==null){
    doc.setFont('helvetica','normal');doc.setTextColor(120,120,120);doc.setFontSize(fs-1);
    doc.text('Total cotizado',tx-45,y);doc.text(fmt(S.totalCotizado),tx,y,{align:'right'});
    y+=5.5*k;
    doc.setDrawColor(...PDF_N);doc.setLineWidth(0.5);doc.line(tx-50,y-3.5*k,tx,y-3.5*k);
    doc.setFont('helvetica','bold');doc.setFontSize(fs+1);
    doc.setTextColor(...(saldo>0?[200,0,0]:PDF_G));
    doc.text('Saldo pendiente',tx-45,y+1);doc.text(fmt(saldo),tx,y+1,{align:'right'});
    y+=7*k;
  }
  doc.setFont('helvetica','normal');doc.setFontSize(fs-2);doc.setTextColor(130,130,130);
  doc.text('Forma de pago: '+(PAGOS.find(p=>p.id===S.formaPago)?.l.replace(/^\S+\s/,'')||''),tx,y,{align:'right'});
  y+=8*k;

  if(S.notas){
    doc.setFillColor(249,249,249);
    doc.setFontSize(fs-1);
    const notasLines=doc.splitTextToSize('Notas: '+S.notas,pw-marginX*2-8);
    const boxH=notasLines.length*4.2*k+6*k;
    doc.rect(marginX,y,pw-marginX*2,boxH,'F');
    doc.setTextColor(80,80,80);
    doc.text(notasLines,marginX+4,y+5*k);
    y+=boxH+8*k;
  }

  const sigY=y+18*k;
  const sigW=70,sigH=16*k;
  if(S.firmaCliente){try{doc.addImage(S.firmaCliente,'PNG',marginX,sigY-sigH-2,sigW,sigH,undefined,'FAST');}catch(e){}}
  if(S.firmaEntrega){try{doc.addImage(S.firmaEntrega,'PNG',pw-marginX-sigW,sigY-sigH-2,sigW,sigH,undefined,'FAST');}catch(e){}}
  doc.setDrawColor(50,50,50);doc.setLineWidth(0.3);
  doc.line(marginX,sigY,marginX+sigW,sigY);
  doc.line(pw-marginX-sigW,sigY,pw-marginX,sigY);
  doc.setFont('helvetica','normal');doc.setFontSize(fs-2);doc.setTextColor(80,80,80);
  doc.text('Firma del cliente',marginX+35,sigY+4*k,{align:'center'});
  doc.text(S.cli.nombre||'',marginX+35,sigY+8*k,{align:'center'});
  doc.text('Firma de quien entrega',pw-marginX-35,sigY+4*k,{align:'center'});
  doc.text(q.nombre,pw-marginX-35,sigY+8*k,{align:'center'});
  y=sigY+14*k;

  doc.setDrawColor(230,230,230);doc.line(marginX,y,pw-marginX,y);
  doc.setFontSize(Math.max(5,fs-3));doc.setTextColor(160,160,160);
  doc.text('Climas Inverter Monterrey · Autorizado Carrier · '+q.tel,pw/2,y+4*k,{align:'center'});
  y+=8*k;

  return {doc,finalY:y,pages:doc.internal.getNumberOfPages()};
}

function buildPdfDoc(){
  const sizes=[9,8,7,6.5,6,5.5];
  let last=null;
  for(const fs of sizes){
    const r=renderPdfDoc(fs);
    last=r;
    if(r.finalY<=283&&r.pages===1) return r.doc;
  }
  return last.doc;
}

async function sharePdf(){
  try{
    if(typeof window.jspdf==='undefined'){alert('No se pudo cargar el generador de PDF (revisa tu conexión a internet). Usa el botón de Imprimir como alternativa.');return;}
    const doc=buildPdfDoc();
    const blob=doc.output('blob');
    const file=new File([blob],S.folio+'.pdf',{type:'application/pdf'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:S.folio,text:'Nota de compra - Climas Inverter Monterrey'});
    } else {
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');a.href=url;a.download=S.folio+'.pdf';a.click();
      alert('Tu navegador no soporta compartir directo. El PDF se descargó — adjúntalo manualmente en WhatsApp o correo.');
    }
  }catch(e){alert('Error generando PDF: '+e.message+'\\n\\nUsa el botón de Imprimir como alternativa.');}
}
async function downloadPdf(){
  try{
    if(typeof window.jspdf==='undefined'){alert('No se pudo cargar el generador de PDF. Usa Imprimir.');return;}
    const doc=buildPdfDoc();
    doc.save(S.folio+'.pdf');
  }catch(e){alert('Error generando PDF: '+e.message);}
}

// ═══════════ EVENTS ═══════════
function attachEvents(){
  const q=s=>document.querySelector(s);
  const qa=s=>document.querySelectorAll(s);

  q('#btn-prev')?.addEventListener('click',()=>goStep(Math.max(0,S.step-1)));
  q('#btn-next')?.addEventListener('click',()=>{
    syncForm();
    if(S.step===1&&!S.cli.nombre.trim()){alert('Por favor ingresa el nombre del cliente.');return;}
    if(S.step===3&&!S.firmaCliente){if(!confirm('No hay firma del cliente. ¿Continuar sin firma?'))return;}
    goStep(Math.min(STEPS.length-1,S.step+1));
  });

  qa('.tipo-btn').forEach(b=>b.addEventListener('click',()=>{
    syncForm();
    const nt=b.dataset.id;
    seedDefaultItem(nt);
    set({tipo:nt});
  }));
  qa('.quoter-btn').forEach(b=>b.addEventListener('click',()=>{syncForm();set({quoter:b.dataset.q});}));
  qa('.cat-btn').forEach(b=>b.addEventListener('click',()=>{syncForm();set({categoria:b.dataset.c});}));
  qa('.pago-btn').forEach(b=>b.addEventListener('click',()=>{syncForm();set({formaPago:b.dataset.p});}));

  qa('.rm-item').forEach(b=>b.addEventListener('click',()=>{syncForm();set({items:S.items.filter(x=>x.id!==b.dataset.id)});}));

  q('#add-manual')?.addEventListener('click',()=>{
    syncForm();
    set({items:[...S.items,{id:uid(),desc:'',cantidad:1,precio:0,tag:'manual'}]});
  });
  q('#add-equipo')?.addEventListener('click',()=>{syncForm();set({modal:'picker'});});
  q('#close-modal')?.addEventListener('click',()=>set({modal:null}));

  const pickerSearch=q('#picker-search');
  if(pickerSearch){
    pickerSearch.addEventListener('input',e=>{
      const v=e.target.value.toLowerCase();
      qa('#picker-list .catalog-item').forEach(row=>{
        const t=(row.dataset.brand||'')+' '+(row.textContent||'').toLowerCase();
        row.style.display=t.includes(v)?'':'none';
      });
      qa('#picker-list .brand-group').forEach(grp=>{
        const visible=[...grp.querySelectorAll('.catalog-item')].some(r=>r.style.display!=='none');
        grp.style.display=visible?'':'none';
      });
    });
    setTimeout(()=>pickerSearch.focus(),50);
  }

  qa('.catalog-item').forEach(item=>item.addEventListener('click',()=>{
    const eq=S.catalog.find(x=>x.id===item.dataset.id);
    if(!eq)return;
    const specs=`${eq.t}T · ${eq.v} · ${eq.sf==='FC'?'Frío-Calor':'Solo Frío'} · ${eq.mod} · ${eq.seer} SEER`;
    set({items:[...S.items,{id:uid(),desc:eq.m,specs,cantidad:1,precio:eq.pL,tag:'equipo'}],modal:null});
  }));

  q('#clear-cliente')?.addEventListener('click',()=>{
    const c=document.getElementById('sig-cliente');const ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);S.firmaCliente=null;
  });
  q('#clear-entrega')?.addEventListener('click',()=>{
    const c=document.getElementById('sig-entrega');const ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);S.firmaEntrega=null;
  });

  q('#btn-pdf-share')?.addEventListener('click',sharePdf);
  q('#btn-pdf-download')?.addEventListener('click',downloadPdf);

  q('#btn-new-doc')?.addEventListener('click',()=>{
    if(confirm('¿Iniciar un documento nuevo? Se perderán los datos actuales no guardados.')) resetState();
  });
}

seedDefaultItem(S.tipo);
render();
</script>
