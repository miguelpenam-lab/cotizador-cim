<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Cotizador CIM v6.14</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f4f6f9;color:#1a1a1a;font-size:14px}
input,select,textarea{font-family:inherit;border:1px solid #d0d5dd;border-radius:6px;padding:7px 10px;font-size:13px;color:#1a1a1a;outline:none;background:#fff;width:100%;transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:#6ec25b;box-shadow:0 0 0 2px #6ec25b22}
button{font-family:inherit;cursor:pointer;border:none;transition:all .15s}
.btn-g{background:#6ec25b;color:#fff;border-radius:8px;padding:8px 18px;font-weight:700;font-size:13px}
.btn-n{background:#071740;color:#fff;border-radius:8px;padding:8px 18px;font-weight:700;font-size:13px}
.btn-ghost{background:#fff;color:#071740;border:1.5px solid #ccc;border-radius:8px;padding:8px 16px;font-weight:600;font-size:13px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:300;display:flex;align-items:flex-end;justify-content:center}
.modal-box{background:#fff;border-radius:16px 16px 0 0;width:100%;max-width:720px;max-height:90vh;overflow-y:auto;padding:18px}
.zone-card{background:#fff;border:1px solid #e0e0e0;border-radius:10px;padding:12px;margin-bottom:10px}
.opt-slot{border:1.5px dashed #ccc;border-radius:7px;padding:8px;cursor:pointer;font-size:11px;color:#aaa;text-align:center;min-height:52px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2px;transition:all .15s}
.opt-slot:hover{border-color:#6ec25b;color:#6ec25b}
.opt-filled{border:1.5px solid #6ec25b;background:#f0f7ee;border-radius:7px;padding:7px 8px;font-size:11px;cursor:pointer;line-height:1.4}
.catalog-item{padding:8px 10px;border-bottom:1px solid #f0f0f0;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:12px;transition:background .1s;gap:8px}
.catalog-item:hover{background:#f0f7ee}
.catalog-item.hidden{display:none}
.chk-row{display:flex;align-items:flex-start;gap:10px;cursor:pointer;font-size:13px;padding:5px 0}
.chk-row input[type=checkbox]{accent-color:#6ec25b;width:16px;height:16px;cursor:pointer;margin-top:1px;flex-shrink:0}
.toggle-pill{display:flex;gap:6px;flex-wrap:wrap}
.tpill{padding:6px 14px;border-radius:20px;font-size:12px;font-weight:600;border:1.5px solid #ccc;background:#fff;color:#888}
.tpill.on{background:#071740;color:#fff;border-color:#071740}
.fav-btn{background:none;border:none;font-size:14px;padding:0 4px;cursor:pointer;opacity:.5;flex-shrink:0}
.fav-btn.active{opacity:1}
.seer-badge{background:#e8f0fe;color:#1a56b0;border-radius:4px;padding:1px 5px;font-size:10px;font-weight:600}
.wifi-badge{background:#e8f5e9;color:#2e7d32;border-radius:4px;padding:1px 5px;font-size:10px;font-weight:600}
.rec-badge{background:#071740;color:#6ec25b;border-radius:4px;padding:2px 8px;font-size:10px;font-weight:700;letter-spacing:.3px}
@media print{
  .no-print{display:none!important}
  body{background:#fff!important;margin:0;padding:0}
  #app>div{padding-bottom:0!important;min-height:unset!important;background:#fff!important}

  /* Quitar header/footer de Safari (URL, fecha, página) */
  @page{margin:0;size:A4 portrait}

  /* Compensar márgenes eliminados con padding en el documento */
  #print-area{padding:0.6cm 0.9cm!important}
  .print-doc{border:none!important;border-radius:0!important;padding:0!important;margin:0!important;box-shadow:none!important}

  /* Fuentes compactas para entrar en una hoja */
  .print-doc *{font-size:7.5pt!important;line-height:1.2!important}
  .print-doc strong{font-size:7.5pt!important}

  /* Evitar cortes */
  table{page-break-inside:avoid!important;break-inside:avoid!important;width:100%!important}
  tr{page-break-inside:avoid!important;break-inside:avoid!important}

  /* Celdas compactas */
  .print-doc td,.print-doc th{padding:2px 4px!important;font-size:7pt!important}
  .seer-badge,.wifi-badge{font-size:6pt!important;padding:0 2px!important}

  /* Mantener colores */
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
}
/* ── MOBILE (≤600px) ───────────────────────── */
@media(max-width:600px){
  /* App container */
  #app>div{padding:0 0 80px!important}
  
  /* Header más compacto */
  .no-print[style*="background:#071740"]{padding:10px 14px!important}
  
  /* Stepper: labels más pequeños */
  .stepper span{font-size:7px!important}
  .stepper>div>div>div:first-child{width:22px!important;height:22px!important;font-size:10px!important}

  /* Contenido principal */
  .main-content{padding:14px!important}

  /* Grids de 2 columnas → 1 columna */
  [style*="grid-template-columns:1fr 1fr"]{grid-template-columns:1fr!important}
  
  /* Grid de 3 columnas → 1 columna */
  [style*="grid-template-columns:1fr 1fr 1fr"]{grid-template-columns:1fr!important}
  [style*="grid-template-columns:repeat(3,1fr)"]{grid-template-columns:1fr 1fr!important}

  /* Campos flex 50% → 100% */
  [style*="flex:0 0 calc(50%"]{flex:1 1 100%!important;min-width:100%!important}

  /* Inputs y selects más grandes para touch */
  input,select,textarea{font-size:16px!important;padding:10px 12px!important;min-height:44px!important}
  
  /* Botones táctiles */
  .btn-g,.btn-n,.btn-ghost{min-height:44px!important;font-size:14px!important;padding:10px 16px!important}
  
  /* Toggle pills en columna si no caben */
  .toggle-pill{flex-direction:column!important;gap:8px!important}
  .tpill{min-height:44px!important;font-size:13px!important;padding:10px 14px!important;justify-content:center!important}

  /* Modal: pantalla completa en móvil */
  .modal-bg{align-items:flex-end!important}
  .modal-box{border-radius:16px 16px 0 0!important;max-height:92vh!important;padding:16px!important}
  .modal-box [style*="flex:0 0 calc(50%"]{flex:1 1 100%!important}

  /* Tabla comparativa: scroll horizontal */
  table{display:block!important;overflow-x:auto!important;white-space:nowrap!important}

  /* Picker de equipos: lista más grande */
  .catalog-item{padding:12px 10px!important;font-size:13px!important;min-height:44px!important}

  /* Footer navegación fijo */
  .footer-nav{position:fixed!important;bottom:0!important;left:0!important;right:0!important;background:#fff!important;border-top:1px solid #e0e0e0!important;padding:10px 14px!important;z-index:100!important}

  /* Cards de tipo de documento */
  .tipo-btn{padding:14px!important}
  .tipo-btn div:first-child{font-size:16px!important}

  /* Cards inst/svc más grandes */
  .inst-card,.svc-card{padding:12px!important;min-height:54px!important}

  /* T2 extras en 2 col en móvil */
  .t2extra-card{padding:10px!important}
}
</style>

function eqPrice(eq,foraneo){
  if(eq.precioOverride!=null) return eq.precioOverride;
  if(foraneo&&eq.pE) return eq.pE;
  return eq.pL;
}

function set(patch){Object.assign(S,patch);render();}

function syncForm(){
  const v=id=>{const e=document.getElementById(id);return e?e.value:'';};
  if(S.step===0){
    S.folio=v('f_folio')||S.folio;
    S.conds.entregaInfo=v('f_entrega_info')||S.conds.entregaInfo;
  }
  if(S.step===1) S.cli={nombre:v('f_nombre'),empresa:v('f_empresa'),tel:v('f_tel'),correo:v('f_correo'),dir:v('f_dir'),ciudad:v('f_ciudad'),ref:v('f_ref')};
  if(S.step===3){
    S.conds.notas=v('f_notas');
    S.descuento.valor=parseFloat(v('f_desc_val'))||0;
    if(S.anticipo.activo) S.anticipo.monto=parseFloat(v('f_anticipo_monto'))||0;
    S.t2extras=S.t2extras.map(ex=>{const inp=document.querySelector(`.t2extra-price[data-id="${ex.id}"]`);return inp?{...ex,p:parseFloat(inp.value)||ex.p}:ex;});
    S.t2custom=S.t2custom.map((ci,idx)=>{
      const n=document.querySelector(`.t2c-nombre[data-idx="${idx}"]`);
      const q=document.querySelector(`.t2c-qty[data-idx="${idx}"]`);
      const p=document.querySelector(`.t2c-precio[data-idx="${idx}"]`);
      return{...ci,nombre:n?n.value:ci.nombre,qty:q?Math.max(1,parseInt(q.value)||1):ci.qty,p:p?parseFloat(p.value)||ci.p:ci.p};
    });
    S.insts=S.insts.map(x=>{const q=document.querySelector(`.inst-qty[data-id="${x.id}"]`);const p=document.querySelector(`.inst-pfinal[data-id="${x.id}"]`);return{...x,qty:q?Math.max(1,parseInt(q.value)||1):x.qty,pFinal:p?parseFloat(p.value)||null:x.pFinal};});
    S.svcs=S.svcs.map(x=>{const q=document.querySelector(`.svc-qty[data-id="${x.id}"]`);const p=document.querySelector(`.svc-pfinal[data-id="${x.id}"]`);return{...x,qty:q?Math.max(1,parseInt(q.value)||1):x.qty,pFinal:p?parseFloat(p.value)||null:x.pFinal};});
  }
  if(S.step===4){S.conds.pago=v('f_pago')||S.conds.pago;const sv=v('f_vig');if(sv==='__custom__'){S.conds.vig='__custom__';S.conds.vigCustom=v('f_vig_custom')||S.conds.vigCustom;}else{S.conds.vig=sv||S.conds.vig;}}
  if(S.step===5) S.conds.entregaInfo=v('f_entrega_info')||S.conds.entregaInfo;
}
function goStep(n){syncForm();set({step:n});}

// ═══════════ TOTALS ═══════════
function totOpciones(){
  const instT=S.insts.reduce((a,x)=>a+(x.pFinal??x.p)*(x.qty??1),0);
  const svcT=S.svcs.reduce((a,x)=>a+(x.pFinal??x.p)*(x.qty??1),0);
  const labor=instT+svcT;
  const ivaL=S.conds.ivaLabor?labor*.16:0;
  const eqX=opt=>S.zonas.reduce((a,z)=>a+(z.opts[opt]?eqPrice(z.opts[opt],S.foraneo):0),0);
  const eA=eqX(0),eB=eqX(1),eC=eqX(2);
  const descFn=tot=>{if(S.descuento.tipo==='pct')return tot*(S.descuento.valor/100);if(S.descuento.tipo==='fijo')return S.descuento.valor;return 0;};
  const tA=eA+labor+ivaL-descFn(eA+labor+ivaL);
  const tB=eB+labor+ivaL-descFn(eB+labor+ivaL);
  const tC=eC+labor+ivaL-descFn(eC+labor+ivaL);
  return{eA,eB,eC,labor,ivaL,tA,tB,tC};
}
function totEspecifico(){
  const eqT=S.eqs.reduce((a,x)=>a+eqPrice(x,S.foraneo)*x.qty,0);
  const instT=S.insts.reduce((a,x)=>a+(x.pFinal??x.p)*(x.qty??1),0);
  const svcT=S.svcs.reduce((a,x)=>a+(x.pFinal??x.p)*(x.qty??1),0);
  const labor=instT+svcT;
  const ivaL=S.conds.ivaLabor?labor*.16:0;
  let sub=eqT+labor+ivaL;
  let desc=S.descuento.tipo==='pct'?sub*(S.descuento.valor/100):S.descuento.tipo==='fijo'?S.descuento.valor:0;
  const total=sub-desc;
  const saldo=S.anticipo.activo?total-S.anticipo.monto:null;
  return{eqT,labor,ivaL,sub,desc,total,saldo};

// ═══════════ BUILD HTML ═══════════
function secT(t){return `<div style="display:flex;align-items:center;gap:8px;margin-bottom:14px"><div style="width:3px;min-width:3px;height:16px;background:${G};border-radius:2px"></div><span style="font-size:12px;font-weight:700;color:${N};text-transform:uppercase;letter-spacing:.7px">${t}</span></div>`;}

function stepper(){
  return `<div class="stepper no-print" style="display:flex;align-items:flex-start;justify-content:center;padding:12px 6px 8px;background:#fff;border-bottom:1px solid #e8eaf0;overflow-x:auto">${STEPS.map((l,i)=>`<div style="display:flex;align-items:center"><div style="display:flex;flex-direction:column;align-items:center;gap:3px;min-width:44px"><div style="width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;background:${S.step>i?G:S.step===i?N:'#ddd'};color:${S.step>i||S.step===i?'#fff':'#999'}">${S.step>i?'✓':i+1}</div><span style="font-size:8px;color:${S.step===i?N:S.step>i?G:'#bbb'};font-weight:${S.step===i?700:400};text-align:center;line-height:1.2">${l}</span></div>${i<STEPS.length-1?`<div style="width:12px;height:2px;margin:0 1px;margin-bottom:14px;background:${S.step>i?G:'#e0e0e0'}"></div>`:''}</div>`).join('')}</div>`;
}

// ─── STEP 0 ──────────────────────────────────────────────
function s0(){
  return `
  ${secT('Tipo de documento')}
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px">${TIPOS.map(t=>`<div class="tipo-btn" data-id="${t.id}" style="border:2px solid ${S.tipo===t.id?G:'#e0e0e0'};border-radius:10px;padding:11px 13px;cursor:pointer;background:${S.tipo===t.id?L:'#fff'}"><div style="font-weight:800;font-size:14px;color:${N}">${t.id}</div><div style="font-size:12px;color:#444;margin:2px 0">${t.l}</div><div style="font-size:11px;color:#888">${t.d}</div>${S.tipo===t.id?`<div style="font-size:11px;color:${G};font-weight:700;margin-top:5px">✓ Seleccionado</div>`:''}</div>`).join('')}</div>

  ${S.tipo!=='T2'&&S.tipo!=='T3'?`
  ${secT('Modo de cotización')}
  <div class="toggle-pill" style="margin-bottom:8px">
    <button class="tpill modo-btn ${S.modo==='opciones'?'on':''}" data-m="opciones">📊 3 Opciones (Confiable / Recomendada / Elite)</button>
    <button class="tpill modo-btn ${S.modo==='especifico'?'on':''}" data-m="especifico">🎯 Equipo específico</button>
  </div>
  <div style="font-size:12px;color:#666;margin-bottom:18px;padding:8px 12px;background:#fff;border-radius:7px;border:1px solid #e0e0e0">${S.modo==='opciones'?'Presenta 3 alternativas por zona. El cliente elige. Ideal para neuroventas — anclas en Elite, cierras en Recomendada.':'El cliente ya sabe qué equipo quiere. Cotización directa.'}</div>
  `:'<div style="padding:8px 12px;background:#e8f5e9;border-radius:7px;margin-bottom:18px;font-size:12px;color:#2e7d32">✓ Solo Equipos — lista de precios directa (sin comparativo de zonas)</div>'}

  ${S.tipo==='T1'?`
  ${secT('Opciones residencial')}
  <div style="background:#fff;border:1px solid #e0e0e0;border-radius:9px;padding:12px;margin-bottom:18px;display:flex;flex-direction:column;gap:8px">
    <label class="chk-row"><input type="checkbox" id="chk_zonas" ${S.usaZonas?'checked':''}><span>Incluir zonas por espacio (fuimos a medir / cotización con visita técnica)</span></label>
    <label class="chk-row"><input type="checkbox" id="chk_depto" ${S.esDepto?'checked':''}><span>Es departamento (se incluirá recomendación de tubo de cobre)</span></label>
  </div>`:''}

  ${secT('Entrega')}
  <div class="toggle-pill" style="margin-bottom:${S.foraneo?'10px':'18px'}">
    <button class="tpill foraneo-btn ${!S.foraneo?'on':''}" data-f="0">📍 Local (MTY y AMM)</button>
    <button class="tpill foraneo-btn ${S.foraneo?'on':''}" data-f="1">🚚 Foráneo</button>
  </div>
  ${S.foraneo?`<div style="background:#fff;border:1px solid #e0e0e0;border-radius:9px;padding:12px;margin-bottom:18px">
    <div style="font-size:11px;color:#666;font-weight:500;margin-bottom:8px">Modalidad de entrega:</div>
    <div style="display:flex;flex-direction:column;gap:5px;margin-bottom:10px">
      ${[['domicilio','🏠 A domicilio del cliente'],['sucursal','🏢 En sucursal / almacén'],['plataforma','📦 Sobre plataforma (flete externo)']].map(([k,l])=>`<label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px"><input type="radio" class="mod-btn" name="entrega_mod" value="${k}" ${S.conds.entregaModalidad===k?'checked':''} style="accent-color:${G};width:15px;height:15px"><span>${l}</span></label>`).join('')}
    </div>
    <label style="font-size:11px;color:#666;font-weight:500;display:block;margin-bottom:4px">Ciudad / destino de envío:</label>
    <input id="f_entrega_info" type="text" value="${esc(S.conds.entregaInfo)}" placeholder="Ciudad de México, CDMX · CP 06600">
    <div style="font-size:11px;color:#888;margin-top:5px">Los precios foráneos ya incluyen el costo de flete.</div>
  </div>`:''}

  ${secT('Quién cotiza')}
  <div style="display:flex;gap:8px;margin-bottom:18px">${Object.entries(QUOTERS).map(([k,q])=>`<div class="quoter-btn" data-q="${k}" style="flex:1;border:2px solid ${S.quoter===k?G:'#e0e0e0'};border-radius:9px;padding:10px 12px;cursor:pointer;background:${S.quoter===k?L:'#fff'}"><div style="font-weight:700;font-size:13px;color:${N}">${q.nombre}</div><div style="font-size:11px;color:#666;margin-top:2px">${q.tel}</div><div style="font-size:11px;color:#666">${q.email}</div>${S.quoter===k?`<div style="font-size:11px;color:${G};font-weight:600;margin-top:4px">✓ Activo</div>`:''}</div>`).join('')}</div>

  ${secT('Folio')}
  <div style="display:flex;gap:10px;align-items:center">
    <input id="f_folio" type="text" value="${esc(S.folio)}" style="max-width:200px">
    <span style="font-size:12px;color:#888">Editable — sigue tu secuencia</span>
  </div>`;
}

// ─── STEP 1 ──────────────────────────────────────────────
function s1(){
  return `${secT('Datos del cliente')}
  <div style="display:flex;flex-wrap:wrap;gap:10px">
    <div style="flex:1 1 100%;display:flex;flex-direction:column;gap:3px"><label style="font-size:11px;color:#666;font-weight:500">Nombre completo *</label><input id="f_nombre" type="text" value="${esc(S.cli.nombre)}" placeholder="Lic. Juan García Pérez"></div>
    <div style="flex:0 0 calc(50% - 6px);display:flex;flex-direction:column;gap:3px"><label style="font-size:11px;color:#666;font-weight:500">Empresa</label><input id="f_empresa" type="text" value="${esc(S.cli.empresa)}" placeholder="(opcional)"></div>
    <div style="flex:0 0 calc(50% - 6px);display:flex;flex-direction:column;gap:3px"><label style="font-size:11px;color:#666;font-weight:500">Teléfono / WhatsApp</label><input id="f_tel" type="text" value="${esc(S.cli.tel)}" placeholder="81 XXXX XXXX"></div>
    <div style="flex:0 0 calc(50% - 6px);display:flex;flex-direction:column;gap:3px"><label style="font-size:11px;color:#666;font-weight:500">Correo electrónico</label><input id="f_correo" type="text" value="${esc(S.cli.correo)}" placeholder="correo@ejemplo.com"></div>
    <div style="flex:0 0 calc(50% - 6px);display:flex;flex-direction:column;gap:3px"><label style="font-size:11px;color:#666;font-weight:500">Ciudad</label><input id="f_ciudad" type="text" value="${esc(S.cli.ciudad)}"></div>
    <div style="flex:1 1 100%;display:flex;flex-direction:column;gap:3px"><label style="font-size:11px;color:#666;font-weight:500">Dirección del inmueble</label><input id="f_dir" type="text" value="${esc(S.cli.dir)}" placeholder="Calle, número, colonia"></div>
    <div style="flex:1 1 100%;display:flex;flex-direction:column;gap:3px"><label style="font-size:11px;color:#666;font-weight:500">Proyecto / Referencia</label><input id="f_ref" type="text" value="${esc(S.cli.ref)}" placeholder="Torre Stella depto 401, KS Services..."></div>
  </div>`;
}

// ─── STEP 2 ──────────────────────────────────────────────
function eqCard(eq,compact){
  const p=eqPrice(eq,S.foraneo);
  if(compact) return `<strong style="color:${N}">${eq.m}</strong><br><span style="color:#555;font-size:10px">${eq.t}T · ${eq.v} · ${eq.sf==='FC'?'Frío-Calor':'Solo Frío'}</span><br><span style="color:${G};font-weight:700;font-size:12px">${fmt(p)}</span><br><span class="seer-badge">${eq.seer} SEER</span> ${eq.wifi?'<span class="wifi-badge">WiFi</span>':''}`;
  return '';
}

function s2(){
  if(S.tipo==='T2'||S.tipo==='T3') return s2single();
  if(S.modo==='opciones') return s2ops();
  return s2single();
}

function s2ops(){
  const zCards=S.zonas.map(z=>`
    <div class="zone-card">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap">
        <select class="z-nombre" data-zid="${z.id}" style="flex:0 0 auto;width:auto;min-width:150px">${ZONAS_LIST.map(n=>`<option ${z.nombre===n?'selected':''}>${n}</option>`).join('')}</select>
        ${z.nombre==='Otro (especificar)'?`<input class="z-libre" data-zid="${z.id}" type="text" value="${esc(z.libre)}" placeholder="Nombre de zona" style="flex:1;min-width:100px">`:'' }
        <button class="rm-zona" data-zid="${z.id}" style="background:none;border:none;color:#c00;font-size:18px;cursor:pointer;margin-left:auto">✕</button>
      </div>
      ${S.usaZonas?`<div style="margin-bottom:8px"><input class="z-nota" data-zid="${z.id}" type="text" value="${esc(z.nota)}" placeholder="Nota técnica: techo 3.5m, drenaje existente, pared norte..."></div>`:''}
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px">
        ${[0,1,2].map(oi=>`<div>
          <div style="font-size:10px;font-weight:700;color:${oi===1?G:N};text-align:center;margin-bottom:3px">${oi===1?'⭐ ':''} ${OPT_NAMES[oi]}</div>
          ${z.opts[oi]
            ?`<div class="opt-filled pick-btn" data-zid="${z.id}" data-oi="${oi}">${eqCard(z.opts[oi],true)}<br><span style="color:#aaa;font-size:9px">Toca para cambiar</span></div>
              <button class="rm-opt" data-zid="${z.id}" data-oi="${oi}" style="width:100%;margin-top:2px;background:none;border:1px solid #f0c0c0;border-radius:5px;color:#c00;font-size:11px;padding:2px;cursor:pointer">Quitar</button>`
            :`<div class="opt-slot pick-btn" data-zid="${z.id}" data-oi="${oi}">+ Seleccionar<br><span style="font-size:10px;margin-top:2px;display:block">${OPT_NAMES[oi]}</span></div>`
          }
        </div>`).join('')}
      </div>
    </div>`).join('');

  return `${secT('Zonas y equipos — 3 opciones')}
  <div style="margin-bottom:12px;font-size:12px;color:#666;background:#fff;padding:8px 12px;border-radius:7px;border:1px solid #e0e0e0">Agrega una zona por espacio. Para cada zona selecciona Confiable · Recomendada · Elite. Los totales se calculan por columna automáticamente.</div>
  ${zCards}
  <button id="add-zona" class="btn-ghost" style="width:100%;margin-top:4px">+ Agregar zona</button>`;
}

function s2single(){
  const rows=S.eqs.map((x,i)=>{
    const p=eqPrice(x,S.foraneo);
    const isEditing=S.editingPriceIdx===i;
    const priceCell=isEditing
      ?`<div style="display:flex;flex-direction:column;align-items:flex-end;gap:2px">
          <input type="number" class="eq-price-input" data-i="${i}" value="${x.precioOverride??p}"
            style="width:92px;padding:4px 7px;font-size:13px;font-weight:700;text-align:right;border:2px solid ${G};border-radius:6px;color:${N}">
          <span style="font-size:9px;color:#999">Enter / Esc</span>
        </div>`
      :`<div style="text-align:right;min-width:80px">
          ${x.precioOverride!=null?`<div style="font-size:9px;color:${G};font-weight:600">Precio editado</div>`:''}
          <div style="font-weight:700;font-size:12px;color:${N}">${fmt(p)}</div>
          <button class="eq-price-btn" data-i="${i}" style="background:none;border:none;font-size:10px;color:#aaa;cursor:pointer;padding:1px 0;display:flex;align-items:center;gap:2px;margin-left:auto">✏️ editar</button>
        </div>`;
    return `<div style="background:${L};border:1px solid ${G}44;border-radius:8px;padding:9px 11px;margin-bottom:6px;display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap">
      <div style="flex:1;min-width:140px">
        <div style="font-size:12px;font-weight:700;color:${N}">${x.m} <span style="font-size:11px;font-weight:400;color:#888">${x.mod||''}</span></div>
        <div style="font-size:11px;color:#555">${x.t}T · ${x.v} · ${x.sf==='FC'?'Frío-Calor':'Solo Frío'}</div>
        ${x.desc?`<div style="font-size:11px;color:#666;margin-top:2px;font-style:italic">${esc(x.desc)}</div>`:''}
        <div style="display:flex;gap:4px;margin-top:3px;flex-wrap:wrap"><span class="seer-badge">${x.seer} SEER</span>${x.wifi?'<span class="wifi-badge">WiFi</span>':''}</div>
        <button class="eq-edit-btn" data-i="${i}" style="background:none;border:none;font-size:11px;color:#888;cursor:pointer;padding:2px 0;margin-top:2px">✏️ editar datos</button>
      </div>
      ${(S.tipo==='T1'&&S.usaZonas)||S.tipo==='T4'?`<select class="eq-zona" data-i="${i}" style="font-size:12px;flex:1;min-width:120px"><option value="">— Sin zona —</option>${ZONAS_LIST.map(n=>`<option ${x.zona===n?'selected':''}>${n}</option>`).join('')}</select>`:''}
      ${S.usaZonas?`<input class="eq-nota" data-i="${i}" type="text" value="${esc(x.nota||'')}" placeholder="Nota técnica..." style="font-size:12px;flex:1;min-width:120px">`:''}
      <div style="display:flex;align-items:center;gap:5px"><label style="font-size:11px;color:#666">Cant.</label><input type="number" min="1" max="20" value="${x.qty}" class="eq-qty" data-i="${i}" style="width:44px;padding:4px 6px;font-size:12px;text-align:center"></div>
      ${priceCell}
      <button class="rm-eq" data-i="${i}" style="background:none;border:none;color:#c00;font-size:17px;cursor:pointer">✕</button>
    </div>`;
  }).join('');
  const skipLabel=S.tipo==='T3'?'(opcional — solo si también se vende un equipo)':S.tipo==='T2'?'— Solo suministro de equipos':'';
  return `${secT(`Equipos ${skipLabel}`)}
  ${rows}
  <button id="open-picker-single" class="btn-ghost" style="width:100%;margin-top:4px">+ Agregar equipo</button>
  ${S.tipo==='T3'?`<div style="margin-top:10px;padding:9px 12px;background:#fff9e6;border:1px solid #f0d060;border-radius:7px;font-size:12px;color:#7a6000">ℹ️ Para T3 los equipos son opcionales. Si solo cotizas servicio, continúa al siguiente paso.</div>`:''}
  ${S.tipo==='T2'?`<div style="margin-top:10px;padding:9px 12px;background:${L};border:1px solid ${G}44;border-radius:7px;font-size:12px;color:#555">ℹ️ Agrega los equipos que el cliente quiere cotizar. En el siguiente paso podrás incluir servicios opcionales.</div>`:''}`;
}

// ─── STEP 3 ──────────────────────────────────────────────
function s3(){
  const {total}=S.modo==='especifico'?totEspecifico():{total:0};

  // Inst cards con qty y precio editable
  const instCards=INST_OPTS.map(i=>{
    const sel=S.insts.find(x=>x.id===i.id);
    const pShow=sel?(sel.pFinal??i.p):i.p;
    return `<div class="inst-card" data-id="${i.id}" style="border:2px solid ${sel?G:'#e0e0e0'};border-radius:8px;padding:9px 11px;cursor:pointer;background:${sel?L:'#fff'}">
      <div style="font-size:12px;font-weight:600;color:${N}">${i.l}</div>
      ${sel?`<div onclick="event.stopPropagation()" style="margin-top:7px;display:flex;flex-direction:column;gap:5px">
        <div style="display:flex;align-items:center;gap:6px">
          <label style="font-size:11px;color:#555">Cant.</label>
          <input type="number" class="inst-qty" data-id="${i.id}" value="${sel.qty??1}" min="1" max="50"
            style="width:46px;padding:3px 5px;font-size:12px;text-align:center;border:1.5px solid ${G};border-radius:5px"
            onclick="event.stopPropagation()">
          <label style="font-size:11px;color:#555">Precio $</label>
          <input type="number" class="inst-pfinal" data-id="${i.id}" value="${pShow}"
            style="width:80px;padding:3px 5px;font-size:12px;font-weight:700;text-align:right;border:1.5px solid ${G};border-radius:5px;color:${N}"
            onclick="event.stopPropagation()">
        </div>
        <div style="font-size:11px;color:${G};font-weight:600">✓ Incluido · Total: ${fmt(pShow*(sel.qty??1))}</div>
      </div>`
      :`<div style="font-size:12px;color:${G};font-weight:700;margin-top:2px">${i.p>0?fmt(i.p):'Por proyecto — agregar precio'}</div>`}
    </div>`;
  }).join('');

  // Svc cards con qty y precio editable
  const svcCards=SVC_OPTS.map(s=>{
    const sel=S.svcs.find(x=>x.id===s.id);
    const pShow=sel?(sel.pFinal??s.p):s.p;
    return `<div class="svc-card" data-id="${s.id}" style="border:2px solid ${sel?G:'#e0e0e0'};border-radius:8px;padding:9px 11px;cursor:pointer;background:${sel?L:'#fff'}">
      <div style="font-size:12px;font-weight:600;color:${N}">${s.l}</div>
      ${sel?`<div onclick="event.stopPropagation()" style="margin-top:7px;display:flex;flex-direction:column;gap:5px">
        <div style="display:flex;align-items:center;gap:6px">
          <label style="font-size:11px;color:#555">Cant.</label>
          <input type="number" class="svc-qty" data-id="${s.id}" value="${sel.qty??1}" min="1" max="50"
            style="width:46px;padding:3px 5px;font-size:12px;text-align:center;border:1.5px solid ${G};border-radius:5px"
            onclick="event.stopPropagation()">
          <label style="font-size:11px;color:#555">Precio $</label>
          <input type="number" class="svc-pfinal" data-id="${s.id}" value="${pShow}"
            style="width:80px;padding:3px 5px;font-size:12px;font-weight:700;text-align:right;border:1.5px solid ${G};border-radius:5px;color:${N}"
            onclick="event.stopPropagation()">
        </div>
        <div style="font-size:11px;color:${G};font-weight:600">✓ Incluido · Total: ${fmt(pShow*(sel.qty??1))}</div>
      </div>`
      :`<div style="font-size:12px;color:${G};font-weight:700;margin-top:2px">${fmt(s.p)}</div>`}
    </div>`;
  }).join('');

  // T2 extras + custom items opcionales
  const t2Section=S.tipo==='T2'?`
  ${secT('Servicios opcionales para incluir en propuesta')}
  <div style="background:#fff;border:1px solid #e0e0e0;border-radius:9px;padding:12px;margin-bottom:16px">
    <div style="font-size:12px;color:#666;margin-bottom:10px">⚠️ Estos servicios <strong>NO se suman al total</strong> — aparecen como opcionales al pie de la cotización con su precio.</div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px">
      ${S.t2extras.map(ex=>`<div class="t2extra-card" data-id="${ex.id}"
        style="border:2px solid ${ex.activo?G:'#e0e0e0'};border-radius:8px;padding:9px 11px;cursor:pointer;background:${ex.activo?L:'#fff'}">
        <div style="font-size:11px;font-weight:600;color:${N};line-height:1.3">${ex.l}</div>
        ${ex.activo
          ?`<input type="number" class="t2extra-price" data-id="${ex.id}" value="${ex.p}" min="0"
              style="width:100%;padding:4px 6px;font-size:13px;font-weight:700;text-align:center;border:1.5px solid ${G};border-radius:5px;margin-top:6px;color:${N}"
              onclick="event.stopPropagation()">
            <div style="font-size:10px;color:${G};font-weight:600;text-align:center;margin-top:3px">✓ Incluido</div>`
          :`<div style="font-size:12px;color:#aaa;margin-top:4px">${fmt(ex.p)}</div>`
        }
      </div>`).join('')}
    </div>
    ${S.t2custom.length>0?S.t2custom.map((ci,idx)=>`<div style="display:flex;align-items:center;gap:7px;margin-bottom:7px;background:${L};border:1px solid ${G}44;border-radius:7px;padding:7px 9px;flex-wrap:wrap">
      <input type="text" class="t2c-nombre" data-idx="${idx}" value="${esc(ci.nombre)}" placeholder="Ej: Kit instalación, tubería cobre, cable..."
        style="flex:1;min-width:120px;font-size:12px;border:1.5px solid ${G};border-radius:5px;padding:4px 7px">
      <label style="font-size:11px;color:#555">Cant.</label>
      <input type="number" class="t2c-qty" data-idx="${idx}" value="${ci.qty}" min="1"
        style="width:44px;padding:3px 5px;font-size:12px;text-align:center;border:1.5px solid ${G};border-radius:5px">
      <label style="font-size:11px;color:#555">$</label>
      <input type="number" class="t2c-precio" data-idx="${idx}" value="${ci.p}" min="0"
        style="width:80px;padding:3px 5px;font-size:12px;font-weight:700;text-align:right;border:1.5px solid ${G};border-radius:5px;color:${N}">
      <button class="rm-t2c" data-idx="${idx}" style="background:none;border:none;color:#c00;font-size:16px;cursor:pointer">✕</button>
    </div>`).join(''):''}
    <button id="add-t2custom" class="btn-ghost" style="width:100%;font-size:12px;margin-top:4px">+ Agregar concepto (material, servicio, kit, otro)</button>
  </div>`:'';

  return `
  ${S.tipo==='T3'?`<div style="padding:10px 12px;background:${L};border:1px solid ${G}44;border-radius:8px;margin-bottom:16px;font-size:12px;color:#555"><strong style="color:${N}">Nota:</strong> El costo de diagnóstico es reembolsable si el cliente acepta la reparación o cotización presentada.</div>`:''}
  ${t2Section}
  ${secT('Instalación y materiales')}
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px">${instCards}</div>
  ${secT('Servicios / mantenimiento')}
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px">${svcCards}</div>
  ${secT('Descuento')}
  <div style="background:#fff;border:1px solid #e0e0e0;border-radius:9px;padding:12px;margin-bottom:16px">
    <div class="toggle-pill" style="margin-bottom:10px">
      ${[['none','Sin descuento'],['pct','Porcentaje %'],['fijo','Monto fijo']].map(([k,l])=>`<button class="tpill desc-btn ${S.descuento.tipo===k?'on':''}" data-dt="${k}">${l}</button>`).join('')}
    </div>
    ${S.descuento.tipo!=='none'?`<div style="display:flex;align-items:center;gap:10px"><input id="f_desc_val" type="number" value="${S.descuento.valor}" min="0" style="max-width:120px" placeholder="${S.descuento.tipo==='pct'?'Ej: 10':'Ej: 500'}"><span style="font-size:13px;color:#666">${S.descuento.tipo==='pct'?'%':'MXN'}</span></div>`:''}
  </div>
  ${secT('Anticipo recibido')}
  <div style="background:#fff;border:1px solid #e0e0e0;border-radius:9px;padding:12px;margin-bottom:16px">
    <label class="chk-row" style="margin-bottom:${S.anticipo.activo?'10px':'0'}"><input type="checkbox" id="chk_anticipo" ${S.anticipo.activo?'checked':''}><span>El cliente dio anticipo</span></label>
    ${S.anticipo.activo?`<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <div style="flex:0 0 auto;display:flex;flex-direction:column;gap:3px"><label style="font-size:11px;color:#666">Monto anticipo</label><input id="f_anticipo_monto" type="number" value="${S.anticipo.monto}" min="0" style="max-width:140px"></div>
      ${total>0?`<div style="font-size:12px;color:#555">Saldo pendiente: <strong style="color:${N}">${fmt(Math.max(0,total-S.anticipo.monto))}</strong></div>`:''}
    </div>`:''}
  </div>
  ${secT('Notas adicionales')}
  <textarea id="f_notas" style="min-height:60px;resize:vertical" placeholder="Observaciones, alcances adicionales...">${esc(S.conds.notas)}</textarea>`;
}

// ─── STEP 4 ──────────────────────────────────────────────
function s4(){
  const pagoOpts=['50% anticipo / 50% al finalizar','50% anticipo / 50% al entregar','Pago al terminar el trabajo','Pago al recibir las unidades','Anticipo acordado + liquidación antes de entrega','100% para embarque','Pago a convenir'];
  return `${secT('Condiciones de pago')}
  <div style="display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px">
    <div style="flex:0 0 calc(50% - 6px);display:flex;flex-direction:column;gap:3px"><label style="font-size:11px;color:#666;font-weight:500">Condición de pago</label>
      <select id="f_pago">${pagoOpts.map(o=>`<option ${S.conds.pago===o?'selected':''}>${o}</option>`).join('')}</select></div>
    <div style="flex:0 0 calc(50% - 6px);display:flex;flex-direction:column;gap:3px"><label style="font-size:11px;color:#666;font-weight:500">Vigencia</label>
      <select id="f_vig">${['15 días hábiles','20 días hábiles','30 días naturales','__custom__'].map(o=>`<option value="${o}" ${S.conds.vig===o?'selected':''}>${o==='__custom__'?'Personalizar...':o}</option>`).join('')}</select>
      ${S.conds.vig==='__custom__'?`<input id="f_vig_custom" type="text" value="${esc(S.conds.vigCustom||'')}" placeholder="Ej: Sujeto a disponibilidad de inventario" style="margin-top:5px">`:''}</div>
  </div>
  ${secT('Formas de pago disponibles (selecciona las que aplican)')}
  <div style="background:#fff;border:1px solid #e0e0e0;border-radius:9px;padding:14px;margin-bottom:14px;display:flex;flex-direction:column;gap:8px">

// ═══════════ WHATSAPP MESSAGE ═══════════
function buildWAMessage(){
  const nombre=S.cli.nombre?S.cli.nombre.split(' ')[0]:'';
  const q=QUOTERS[S.quoter];
  let lines=[];
  if(nombre) lines.push(`${nombre}, buen día ☀️`);
  lines.push('Te comparto opciones de equipos para que puedas considerar cuál se adapta mejor a tu necesidad.');
  lines.push('');

  if(S.modo==='opciones'&&S.zonas.length>0){
    S.zonas.forEach(z=>{
      const nm=z.nombre==='Otro (especificar)'?z.libre:z.nombre;
      if(nm) lines.push(`*${nm}:*`);
      [0,1,2].forEach(oi=>{
        const eq=z.opts[oi];
        if(eq){
          const p=eqPrice(eq,S.foraneo);
          const prem=isGarPrem(eq.m);
          lines.push(`${OPT_NAMES[oi]}${oi===1?' ⭐':''}: *${eq.m}* ${eq.t}T ${eq.v} — ${fmt(p)} (${eq.seer} SEER${eq.wifi?', WiFi':''})`);
        }
      });
    });
    lines.push('');
    const {tA,tB,tC}=totOpciones();
    if(S.insts.length>0||S.svcs.length>0){
      const labor=S.insts.reduce((a,x)=>a+x.p,0)+S.svcs.reduce((a,x)=>a+x.p,0);
      lines.push(`Instalación: ${fmt(labor)}`);
    }
    lines.push(`Total estimado — Confiable: ${fmt(tA)} · Recomendada: ${fmt(tB)} · Elite: ${fmt(tC)}`);
  } else if(S.eqs.length>0){
    S.eqs.forEach(x=>{
      const p=eqPrice(x,S.foraneo);
      lines.push(`*${x.m}* ${x.t}T ${x.v} — ${fmt(p)} (${x.seer} SEER${x.wifi?', WiFi':''})`);
    });
    if(S.insts.length>0){lines.push('');S.insts.forEach(i=>{if(i.p>0)lines.push(`${i.l}: ${fmt(i.p)}`);}); }
    if(S.svcs.length>0){S.svcs.forEach(s=>lines.push(`${s.l}: ${fmt(s.p)}`));}
    const {total}=totEspecifico();
    lines.push(`*Total: ${fmt(total)}*`);
  }

  // Garantías
  const allEqs2=S.modo==='opciones'?S.zonas.flatMap(z=>z.opts.filter(Boolean)):S.eqs;
  const hasPrem=allEqs2.some(x=>isGarPrem(x.m));
  const hasStd=allEqs2.some(x=>!isGarPrem(x.m));

  lines.push('');
  if(hasPrem) lines.push('Los equipos Carrier / Trane / York cuentan con garantía de 5 años en compresor, 1 año en partes incluyendo tarjetas electrónicas y control remoto.');
  if(hasStd) lines.push('Los demás equipos tienen garantía de 5 años en compresor, 1 año en partes y 3 meses en tarjetas electrónicas y control remoto.');
  lines.push('*Al adquirir el equipo e instalación con nosotros, extendemos sin costo 6 meses adicionales de garantía en tarjetas electrónicas.*');
  if(!S.foraneo) lines.push('Si se entrega solo el equipo, aplica únicamente la garantía de la marca. En cualquier caso, seguimos apoyando en temas de garantía.');

  // Entrega
  lines.push('');
  if(!S.foraneo){
    lines.push('Entrega sin costo en Monterrey y Área Metropolitana. También puede recoger en nuestras oficinas: Ave. Lerdo de Tejada 400A, San Nicolás de los Garza.');
  } else {
    lines.push(`Envío foráneo a ${S.conds.entregaInfo||'tu ciudad'} incluido en el precio.`);
  }

  // Instalación básica nota
  if(S.insts.some(i=>i.id==='i1'||i.id==='i2')){
    lines.push('');
    lines.push('*Instalación básica incluye:* kit de fábrica estándar (3–4 metros de tubería y cable de comunicación). Si requiere mayor distancia o material eléctrico adicional, se cotiza aparte al momento de la visita.');
    lines.push('Si ya cuentan con preparación eléctrica (cableado y pastilla independiente desde el centro de carga hasta donde va el condensador), la instalación aplica sin costo adicional de material eléctrico.');
  }

  // Recomendación
  if(allEqs2.length>0){
    const recs=allEqs2.filter(x=>x.seer>=19);
    if(recs.length>0){
      lines.push('');
      lines.push(`En cuanto a eficiencia, le recomendaría${recs.length===1?' el '+recs[0].m:' los de mayor SEER'} considerando la relación precio-eficiencia y la garantía que ofrecen.`);
    }
  }

  lines.push('');
  lines.push(`Vigencia: ${S.conds.vig}. Quedo al pendiente de cualquier duda.`);
  lines.push(`¡Gracias!`);
  lines.push(`— ${q.nombre.split(' ').slice(0,2).join(' ')}, Climas Inverter Monterrey · ${q.tel}`);

  return lines.join('\n');
}

// ═══════════ RENDER ═══════════
function render(){
  const steps_fn=[s0,s1,s2,s3,s4,s5,s6];
  const content=steps_fn[S.step]();
  const {total:tE}=S.modo==='especifico'||S.tipo==='T2'||S.tipo==='T3'?totEspecifico():{total:0};

  const opTotals=[tA,tB,tC].filter((t,i)=>S.zonas.some(z=>z.opts[i]));

  const showTotal=tE>0||(S.modo==='opciones'&&minOp>0);

    ?`Desde ${fmt(minOp)}`

  document.getElementById('app').innerHTML=`

    <div style="background:${N};padding:11px 14px;display:flex;align-items:center;justify-content:space-between" class="no-print">

        </div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <button id="btn-editor" style="background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:6px;padding:5px 9px;font-size:13px" title="Editor de precios">⚙️</button>
        <div style="text-align:right"><div style="color:${G};font-size:9px;font-weight:600;letter-spacing:.5px">FOLIO</div><div style="color:#fff;font-size:12px;font-weight:700">${esc(S.folio)}</div></div>
      </div>
    </div>
    ${stepper()}
    <div style="padding:14px 14px 0" class="main-content">${content}</div>
    <div class="no-print footer-nav" style="position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e0e0e0;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;z-index:100;max-width:720px;margin:0 auto">
      <button id="btn-prev" ${S.step===0?'disabled':''} class="btn-ghost" style="color:${S.step===0?'#ccc':N};border-color:${S.step===0?'#eee':'#ccc'};min-width:90px">← Anterior</button>
      <div style="display:flex;align-items:center;gap:8px">
        <span style="font-size:11px;color:#999">${S.step+1} / ${STEPS.length}</span>
        ${showTotal?`<div style="background:${N};color:#fff;border-radius:14px;padding:3px 10px;font-size:12px;font-weight:700">${totalChip}</div>`:''}
      </div>
      ${S.step<STEPS.length-1
        ?`<button id="btn-next" class="btn-g" style="min-width:110px">Siguiente →</button>`
        :`<div style="display:flex;gap:8px">
            <button id="btn-nueva" class="btn-ghost" style="font-size:12px;padding:8px 12px">+ Nueva</button>
            <button onclick="(function(){
  var nombre=S&&S.cli&&S.cli.nombre?S.cli.nombre.trim():'';
  var folio=S&&S.folio?S.folio:'CIM';
  var suggested=nombre?('Cotización '+nombre+' '+folio):(folio);
  var filename=prompt('Nombre del archivo PDF:',suggested);
  if(filename===null)return;
  var old=document.title;
  document.title=filename||suggested;
  window.print();
  setTimeout(function(){document.title=old;},2000);
})()" class="btn-n" style="font-size:13px">🖨️ PDF</button>
          </div>`

      const lI=document.querySelector(`.price-l[data-id="${eq.id}"]`);
      const eI=document.querySelector(`.price-e[data-id="${eq.id}"]`);
      const pL=lI?parseFloat(lI.value)||eq.pL:eq.pL;
      const pE=eI&&eI.value?parseFloat(eI.value)||null:null;
      return{...eq,pL,pE};
    });
    saveCat(updated);set({catalog:updated,modal:null});
    alert('✅ Precios guardados en tu navegador.');
  });
  q('#export-csv')?.addEventListener('click',()=>{
    const rows=[['ID','Marca','Modelo','Tipo','SF','Voltaje','Toneladas','SEER','WiFi','Precio Local','Precio Foraneo']];
    S.catalog.forEach(x=>rows.push([x.id,x.m,x.mod,x.tipo,x.sf,x.v,x.t,x.seer,x.wifi?'Si':'No',x.pL,x.pE||'']));
    const csv=rows.map(r=>r.join(',')).join('\n');
    const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);a.download='catalogo_CIM.csv';a.click();
  });
  q('#reset-prices')?.addEventListener('click',()=>{if(confirm('¿Restaurar todos los precios predeterminados?')){saveCat(BASE_CAT);set({catalog:BASE_CAT,modal:null});}});

  // Close modal
  q('#close-modal')?.addEventListener('click',()=>set({modal:null,pickerTarget:null}));
}

render();
</script>
</body>
</html>
